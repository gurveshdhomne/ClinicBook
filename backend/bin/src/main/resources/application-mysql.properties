# Create the database first (or keep createDatabaseIfNotExist=true), then run with the "mysql" profile.
spring.datasource.url=jdbc:mysql://localhost:3306/clinicbook?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
