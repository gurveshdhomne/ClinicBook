spring.application.name=clinicbook
server.port=${PORT:8080}

# Default database: H2 file database, so the project runs with zero setup.
# To use MySQL instead, run with:  --spring.profiles.active=mysql
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT (set JWT_SECRET as an environment variable in production; minimum 32 characters)
app.jwt.secret=${JWT_SECRET:change-this-secret-key-before-deploying-1234567890}
app.jwt.expiration-ms=86400000

# Frontend origins allowed to call the API (comma separated)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
